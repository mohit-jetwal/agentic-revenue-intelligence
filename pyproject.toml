[project]
name = "agentic-revenue-intelligence"
version = "0.1.0"
description = "Agentic Revenue, Pricing & Promotion Intelligence Platform for CPG/Retail (Claude + LangGraph + Databricks)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # --- configuration / core ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.4",
    "tenacity>=9.0",
    # --- api ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # --- llm / agents ---
    "anthropic>=0.40",
    "langgraph>=0.3",
    "langchain-core>=0.3",
    # --- data access ---
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "numpy>=1.26,<3.0",
    "sqlalchemy>=2.0",
    # --- analytics / ml ---
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "ortools>=9.11",
    "mlflow>=2.17",
    "pandera[pandas]>=0.20",
]

[project.optional-dependencies]
ui = ["streamlit>=1.39"]
rag = ["chromadb>=0.5"]
notebooks = ["jupyter>=1.1", "matplotlib>=3.9", "seaborn>=0.13"]
# Only needed to regenerate docs/Agentic_Revenue_Intelligence_Handbook.docx.
# Kept out of the base dependencies because nothing the platform runs imports
# them - but declared here so a fresh checkout can rebuild the handbook rather
# than having to rediscover what it was built with.
docs = ["python-docx>=1.1", "pymupdf>=1.24"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
    "bandit>=1.7",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[project.scripts]
ari = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ml", "data", "prompts", "evaluation"]

[tool.hatch.build.targets.wheel.force-include]
# Prompt text is loaded at runtime by prompts.registry, so the .md files must
# ship with the wheel, not just the Python module beside them.
"prompts" = "prompts"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data/local"]

[tool.ruff.lint]
# BLE is enabled deliberately: a blind `except Exception` is almost always a
# bug, and the few places we need one (health checks, the tool wrapper) should
# have to justify themselves with an explicit noqa.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
    "B008", # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# `X` for a feature matrix and `y` for a target is the universal scikit-learn
# convention. Renaming them to satisfy pep8-naming would make this code read as
# non-standard to anyone who has used sklearn, which is a worse outcome than the
# lint. Scoped to the modules that actually follow the convention.
#
# N802 joins the list for the same reason: `CovariateFrame.X` is the accessor
# for the design matrix, and `covariates.x` would read as a coordinate.
"ml/**" = ["N802", "N803", "N806"]
# The handbook generators are almost entirely prose and diagram coordinates.
# Wrapping the string literals to 100 columns would break sentences across lines
# and make the source harder to edit than the document it produces.
#
# RUF001 flags characters that are ambiguous *in code* - a minus sign that is not
# a hyphen, a multiplication sign that is not an x, curly quotes. In a document
# meant to be printed and read they are the correct characters, and replacing
# "-424%" with "-424%" or "20x" with "20x" would degrade the typography of the
# artefact to satisfy a rule about source code.
"docs/**" = ["E501", "RUF001", "RUF002", "RUF003"]
"tests/models/**" = ["S101", "N803", "N806"]
"tests/forecasting/**" = ["S101", "N803", "N806"]
"tests/promo_uplift/**" = ["S101", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
files = ["app", "ml", "data", "prompts", "evaluation"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["data/local/", "notebooks/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "unit: fast, isolated tests with no I/O",
    "integration: tests that exercise the API or on-disk artifacts",
    "models: ML model behaviour tests",
    "agents: agent / workflow behaviour tests",
    "data: synthetic data generation and invariant tests",
    "statistical: relationship-recovery tests; slower, fit regressions on generated data",
    "features: feature engineering and feature repository tests",
    "leakage: point-in-time correctness; the property Steps 4-11 depend on",
    # Distinct from `models` because these test a different property. A model
    # test asks whether predictions are accurate; a causal test asks whether an
    # estimated *effect* is right, which no amount of predictive accuracy
    # establishes and which only known-truth data can answer.
    "causal: recovery of known treatment effects, placebo and confounding tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app", "ml", "data"]
omit = ["*/__init__.py", "app/ui/*"]

[tool.bandit]
exclude_dirs = ["tests", "notebooks", "data/local"]
